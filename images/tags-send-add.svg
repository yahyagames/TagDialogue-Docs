<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26bbff"/></marker></defs><rect width="900" height="360" rx="14" fill="#101014"/><text x="225" y="40" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Send Tag  =  an event</text><text x="675" y="40" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Add Tag  =  memory</text><line x1="450" y1="24" x2="450" y2="300" stroke="#2c2c35" stroke-width="1"/><rect x="150" y="70" width="150" height="40" rx="20" fill="#1d1d24" stroke="#3f99ff" stroke-width="1" /><text x="225" y="95" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#e8e8ec" text-anchor="middle">Door.Main.Knock</text><rect x="60" y="150" width="100" height="34" rx="8" fill="#202027" stroke="#2c2c35" stroke-width="1" /><text x="110" y="172" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#c9c9d2" text-anchor="middle">Door BP</text><path d="M225,110 C265,110 70,150 110,150" fill="none" stroke="#3f99ff" stroke-width="2"/><rect x="175" y="200" width="100" height="34" rx="8" fill="#202027" stroke="#2c2c35" stroke-width="1" /><text x="225" y="222" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#c9c9d2" text-anchor="middle">Quest log</text><path d="M225,110 C265,110 185,200 225,200" fill="none" stroke="#3f99ff" stroke-width="2"/><rect x="290" y="250" width="100" height="34" rx="8" fill="#202027" stroke="#2c2c35" stroke-width="1" /><text x="340" y="272" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#c9c9d2" text-anchor="middle">Sound</text><path d="M225,110 C282.5,110 282.5,250 340,250" fill="none" stroke="#3f99ff" stroke-width="2"/><text x="225" y="300" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#9a9aa6" text-anchor="middle">Heard once by every listener. Not remembered.</text><rect x="540" y="70" width="270" height="190" rx="10" fill="#202027" stroke="#40d980" stroke-width="1" /><text x="556" y="94" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#40d980" text-anchor="start">TAG STATE (saved)</text><rect x="556" y="108" width="238" height="32" rx="6" fill="#1d1d24" stroke="#2c2c35" stroke-width="1" /><text x="572" y="129" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#e8e8ec" text-anchor="start">Quest.FindKey</text><rect x="556" y="152" width="238" height="32" rx="6" fill="#1d1d24" stroke="#2c2c35" stroke-width="1" /><text x="572" y="173" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#e8e8ec" text-anchor="start">Item.Key.Picked</text><rect x="556" y="196" width="238" height="32" rx="6" fill="#1d1d24" stroke="#2c2c35" stroke-width="1" /><text x="572" y="217" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#e8e8ec" text-anchor="start">Reward.Sword</text><text x="675" y="300" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#9a9aa6" text-anchor="middle">Stays until removed. Conditions and quests read it.</text><text x="450.0" y="344" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#9a9aa6" text-anchor="middle">Both are Blueprint nodes and action pills: Send Tag / Add Tag / Remove Tag.</text></svg>