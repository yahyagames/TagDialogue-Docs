<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26bbff"/></marker></defs><rect width="900" height="300" rx="14" fill="#101014"/><rect x="40" y="60" width="260" height="170" rx="10" fill="#202027" stroke="#40d980" stroke-width="1" /><text x="56" y="86" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#40d980" text-anchor="start">TAG DIALOGUE REMEMBERS</text><text x="60" y="116" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8e8ec" text-anchor="start">• Tag state</text><text x="60" y="144" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8e8ec" text-anchor="start">• Running tasks</text><text x="60" y="172" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8e8ec" text-anchor="start">• Every NPC's memory</text><text x="60" y="200" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8e8ec" text-anchor="start">• Global text variables</text><rect x="380" y="60" width="220" height="60" rx="10" fill="#1d1d24" stroke="#26bbff" stroke-width="1" /><text x="490" y="86" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Save To Slot</text><text x="490" y="106" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#9a9aa6" text-anchor="middle">one node, built in</text><rect x="380" y="170" width="220" height="60" rx="10" fill="#1d1d24" stroke="#4a4a55" stroke-width="1" /><text x="490" y="196" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Capture Save Data</text><text x="490" y="216" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#9a9aa6" text-anchor="middle">for your own save system</text><path d="M300,120 C340,120 340,90 380,90" fill="none" stroke="#26bbff" stroke-width="2.5"/><path d="M300,170 C340,170 340,200 380,200" fill="none" stroke="#9a9aa6" stroke-width="2.5"/><rect x="680" y="60" width="180" height="60" rx="10" fill="#202027" stroke="#2c2c35" stroke-width="1" /><text x="770" y="95" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#e8e8ec" text-anchor="middle">TagDialogue.sav</text><rect x="680" y="170" width="180" height="60" rx="10" fill="#202027" stroke="#2c2c35" stroke-width="1" /><text x="770" y="205" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e8e8ec" text-anchor="middle">Your SaveGame</text><path d="M604,90 L674,90" stroke="#26bbff" stroke-width="3" fill="none" marker-end="url(#ah)"/><path d="M604,200 L674,200" stroke="#26bbff" stroke-width="3" fill="none" marker-end="url(#ah)"/><text x="450.0" y="280" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#9a9aa6" text-anchor="middle">Load From Slot / Restore Save Data put it back. NPCs update right away.</text></svg>