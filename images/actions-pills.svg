amily="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">Close Task</text><text x="170.0" y="269" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#9a9aa6" text-anchor="start">· close an option for good</text><circle cx="290" cy="52" r="14" fill="#26bbff"/><text x="290" y="57" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#041018" text-anchor="middle">1</text><text x="490.0" y="316" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#9a9aa6" text-anchor="middle">Add one: double-click any wire, or right-click it → Insert on this wire.</text></svg>